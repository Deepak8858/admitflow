name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typechecks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 runtime
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolated tests, typechecks, build and migration dry run
        run: npm run verify

  browser:
    name: Browser regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 runtime
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Isolated browser fixtures
        run: npm run verify:browser
      - name: Retain failure traces from synthetic fixtures
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24 runtime
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 runtime
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 runtime
        with:
          node-version: '24'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gitleaks"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$destination/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$destination/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$destination/gitleaks.tar.gz" -C "$destination" gitleaks
      - name: Scan complete checked-out Git history (redacted)
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact=100 --no-banner'
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/actionlint"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$destination/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$destination/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$destination/actionlint.tar.gz" -C "$destination" actionlint
          "$destination/actionlint" -shellcheck= -pyflakes=
      - name: Complete lockfile audit
        run: npm audit --package-lock-only --ignore-scripts

  containers:
    name: Container compatibility and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build service images using the reviewed runtime
        run: |
          docker build --target web --build-arg NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://admitflow.example/callback --tag admitflow-web:ci .
          docker build --target worker --tag admitflow-worker:ci .
      - name: Verify runtime, native dependencies, startup and authentication boundary
        run: bash infra/smoke-images.sh admitflow-web:ci admitflow-worker:ci
      - name: Scan web image
        run: bash infra/scan-image.sh admitflow-web:ci web-security.json
      - name: Scan worker image
        if: success() || failure()
        run: bash infra/scan-image.sh admitflow-worker:ci worker-security.json
      - name: Retain complete image findings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: '*-security.json'
          retention-days: 30
          if-no-files-found: ignore
